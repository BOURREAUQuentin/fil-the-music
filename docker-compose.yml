services:
  catalog:
    build: 
      context: .
      dockerfile: catalog/Dockerfile
    ports: 
    - 3200:3200

  mongo:
    image: mongo
    restart: always
    ports: 
    - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: damien
      MONGO_INITDB_ROOT_PASSWORD: filthemusic
      MONGO_INITDB_DATABASE: catalog_db
    volumes:
    - ./catalog/import/init-data.js:/docker-entrypoint-initdb.d/init-data.js:ro

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: damien
      ME_CONFIG_MONGODB_ADMINPASSWORD: filthemusic
      ME_CONFIG_MONGODB_URL: mongodb://damien:filthemusic@mongo:27017/
      ME_CONFIG_BASICAUTH: false

  game:
    build:
      context: ./game
      dockerfile: Dockerfile
    container_name: game_service
    ports:
      - "50051:50051"
    environment:
      - MONGO_URI=mongodb://root:example@mongodb:27017/game?authSource=admin
    depends_on:
      - mongodb

  gateway:
    build: ./gateway
    container_name: api_gateway
    ports:
      - "8080:8080"
    depends_on:
      - game
