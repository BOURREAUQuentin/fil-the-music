services:
  catalog:
    build: 
      context: .
      dockerfile: catalog/Dockerfile
    ports: 
      - 3200:3200
    environment:
      - MONGO_URI=mongodb://root:password@mongo:27017/catalog_db?authSource=admin
    networks:
      - app-network

  mongo:
    image: mongo
    restart: always
    ports: 
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - ./import/init-catalog.js:/docker-entrypoint-initdb.d/init-catalog.js:ro
      - ./import/init-user.js:/docker-entrypoint-initdb.d/init-user.js:ro
    networks:
      - app-network

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://root:password@mongo:27017/
      ME_CONFIG_BASICAUTH: false
    networks:
      - app-network

  user:
    build:
      context: ./user
      dockerfile: Dockerfile
    container_name: user_service
    ports:
      - "3201:3201"
    env_file:
      - user/.env
    environment:
      - MONGO_URI=mongodb://root:password@mongo:27017/user_db?authSource=admin
    depends_on:
      - mongo
    networks:
      - app-network

  game:
    build:
      context: ./game
      dockerfile: Dockerfile
    container_name: game_service
    ports:
      - "50051:50051"
    environment:
      - MONGO_URI=mongodb://root:password@mongo:27017/game_db?authSource=admin
      - USER_SERVICE_URL=http://user:3201
    depends_on:
      - mongo
    networks:
      - app-network

  gateway:
    build: ./gateway
    container_name: api_gateway
    ports:
      - "8080:8080"
    environment:
      - USER_SERVICE_URL=http://user:3201
    depends_on:
      - game
      - user
    networks:
      - app-network

  ingestion:
    build: 
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: ingestion_service
    env_file:
      - ./ingestion/.env
    environment:
      - CATALOG_URL=http://catalog:3200/graphql
    ports:
      - "8000:8000"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - catalog
    networks:
      - app-network

networks:
  app-network:
    driver: bridge